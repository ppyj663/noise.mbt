name: CI

on:
  push:
  pull_request:

jobs:
  moon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Put moon on PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check
        run: moon check
      - name: Build
        run: moon build
      - name: Test
        run: moon test
      - name: Format
        run: moon fmt --check
      - name: Example
        run: moon run example
